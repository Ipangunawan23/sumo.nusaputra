<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SUMO - Sistem Ujian Mahasiswa Online</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
<style>
:root{
  --nav:#2f4858; --bg:#f4f6f9; --slate:#546e7a; --grey:#9e9e9e; --text:#1f2933; --muted:#6b7785;
  --green-bg:#e2f8e2; --green-bd:#bfe9bf; --red-bg:#fde0e0; --red-bd:#f5b8b8; --cyan-bg:#e0f7fa; --cyan-bd:#b4ebf2;
  --blue:#1e88e5; --teal:#0f7c8a; --danger:#f44336; --ok:#2e9e4f; --maroon:#7b1646;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:'Open Sans','Segoe UI',Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.5}
button{font-family:inherit}
.topbar{position:sticky;top:0;z-index:50;background:var(--nav);color:#fff;height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;gap:10px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:.5px;cursor:pointer;font-size:17px}
.tb-left{display:flex;align-items:center;gap:16px}
.tb-right{display:flex;align-items:center;gap:18px;font-weight:600;font-size:14px}
.tb-right button,.tb-left button{color:#fff;background:none;border:0;font:inherit;cursor:pointer;display:flex;align-items:center;gap:6px;padding:6px 2px}
.burger{display:none!important;font-size:20px}
.flag{display:inline-block;width:28px;height:19px;border-radius:3px;background:linear-gradient(#e70011 50%,#fff 50%);box-shadow:0 0 0 1px rgba(255,255,255,.35)}
.lang{display:flex;align-items:center;gap:6px}
.tb-right .langbtn{padding:0 14px;height:56px;align-self:stretch;margin-right:-16px}
.tb-right .langbtn.open{background:#d3d3d3;color:var(--nav)}
.flag.en{background:url("data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2060%2030'%3E%3CclipPath%20id='s'%3E%3Cpath%20d='M0,0%20v30%20h60%20v-30%20z'/%3E%3C/clipPath%3E%3CclipPath%20id='t'%3E%3Cpath%20d='M30,15%20h30%20v15%20z%20v15%20h-30%20z%20h-30%20v-15%20z%20v-15%20h30%20z'/%3E%3C/clipPath%3E%3Cg%20clip-path='url(%23s)'%3E%3Cpath%20d='M0,0%20v30%20h60%20v-30%20z'%20fill='%23012169'/%3E%3Cpath%20d='M0,0%20L60,30%20M60,0%20L0,30'%20stroke='%23fff'%20stroke-width='6'/%3E%3Cpath%20d='M0,0%20L60,30%20M60,0%20L0,30'%20clip-path='url(%23t)'%20stroke='%23C8102E'%20stroke-width='4'/%3E%3Cpath%20d='M30,0%20v30%20M0,15%20h60'%20stroke='%23fff'%20stroke-width='10'/%3E%3Cpath%20d='M30,0%20v30%20M0,15%20h60'%20stroke='%23C8102E'%20stroke-width='6'/%3E%3C/g%3E%3C/svg%3E") center/cover no-repeat}
.langmenu{position:fixed;top:56px;right:0;width:min(61vw,260px);background:#fff;border:1px solid #e3e8ee;border-top:0;border-radius:0 0 14px 14px;box-shadow:0 8px 20px rgba(0,0,0,.14);z-index:60;display:none;padding:4px 0}
.langmenu.open{display:block}
.langmenu button{display:flex;align-items:center;gap:10px;width:100%;padding:11px 16px;background:none;border:0;font:inherit;font-size:14.5px;font-weight:600;color:var(--text);cursor:pointer;text-align:left}
.langmenu button:hover,.langmenu button.on{background:#eef2f5}
.langmenu .flag{width:19px;height:13px;border-radius:2px;box-shadow:0 0 0 1px rgba(0,0,0,.12);flex:none}
#hdrTimer{display:none!important}
#hdrTimer{background:rgba(255,255,255,.15);padding:4px 10px;border-radius:14px;font-variant-numeric:tabular-nums;display:none}
.menu{position:fixed;top:0;left:0;bottom:0;width:78%;max-width:340px;background:#fff;color:var(--text);box-shadow:0 0 24px rgba(0,0,0,.25);z-index:100;overflow-y:auto;transform:translateX(-100%);visibility:hidden;transition:transform .22s ease,visibility .22s}
.menu.open{transform:none;visibility:visible}
.menu-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:99;display:none}
.menu-bg.open{display:block}
.menu-head{display:flex;align-items:center;justify-content:space-between;padding:26px 24px 22px;border-bottom:1px solid #e3e8ee;margin-bottom:8px}
.menu-head .mbrand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px;letter-spacing:.5px;color:var(--nav)}
.menu-head .mclose{background:none;border:0;font-size:20px;color:var(--slate);cursor:pointer;padding:6px}
.menu .mi{display:flex;align-items:center;gap:16px;width:100%;padding:16px 24px;font:inherit;font-size:16px;font-weight:600;color:var(--text);background:none;border:0;border-radius:0;text-align:left;text-decoration:none;cursor:pointer}
.menu .mi i{width:22px;text-align:center;color:var(--slate);flex:none}
.menu button.mi:hover,.menu a.mi:hover{background:#eef2f5}
.menu div.mi{cursor:default}
@media(max-width:860px){.burger{display:flex!important}.hide-m{display:none!important}}

.wrap{max-width:1100px;margin:0 auto;padding:16px}
.wrap.narrow{max-width:640px}
.card{background:#fff;border:1px solid #e3e8ee;border-radius:16px;box-shadow:0 1px 3px rgba(20,40,60,.06)}
.profile{display:flex;align-items:center;gap:12px;padding:10px 16px;margin-bottom:14px}
.logo{width:60px;height:60px;border-radius:50%;background:var(--maroon);color:#f3d9a4;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;flex:none;border:3px solid #a33d6a;font-family:Georgia,serif}
.logo-img{width:52px;height:52px;border-radius:50%;object-fit:cover;flex:none;display:block}
.profile h1{margin:0;font-size:14px;font-weight:700;letter-spacing:0}
.btn{border:0;border-radius:12px;padding:11px 18px;font-weight:700;font-size:15px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;color:#fff;background:var(--nav)}
.btn.dark{background:var(--nav)} .btn.danger{background:var(--danger);letter-spacing:3px}
.btn.ghost{background:#eef2f5;color:var(--text)} .btn.blue{background:var(--blue)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:active{transform:translateY(1px)}
.btn.lg{font-size:16px;padding:13px 22px}
.btn.rtop{font-size:14px;font-weight:600;padding:10px 16px;border-radius:10px}
.sec-title{display:flex;align-items:center;gap:8px;margin:26px 0 10px;padding-bottom:10px;border-bottom:1px solid #dfe5eb;color:#56657a;font-weight:700;font-size:15px;letter-spacing:.5px;flex-wrap:wrap}
.count{background:#eceff3;color:var(--text);border-radius:20px;padding:3px 12px;font-size:12.5px}

.recap{padding:16px 20px;margin-top:14px}
.recap h3{margin:0 0 10px;font-size:15px;color:#56657a;letter-spacing:.6px}
.recap-grid{display:flex;flex-wrap:wrap;gap:8px}
.rchip{background:#f1f4f7;border-radius:10px;padding:6px 12px;font-size:13px}
.rchip b{font-size:15px}
.rtotal{margin-top:10px;font-weight:600}

.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(360px,100%),1fr));gap:16px}
.exam{position:relative;padding:22px 24px 22px 28px;border-left:0;overflow:hidden}
.exam::before{content:"";position:absolute;left:0;top:0;bottom:0;width:7px;background:var(--teal)}
.ehead{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 12px;margin-bottom:8px}
.exam h3{margin:0;font-size:21px;font-weight:700;line-height:1.25}
.ehead .status{margin-bottom:0}
.s-past{background:#9e9e9e}
.exam.past{background:#fbfbfc}
.exam.past::before{background:#d3d8dc}
.exam.past h3{color:#4a5560}
.exam.past .lect{color:#8a949e}
.exam.past .pill,.exam.past .chip,.exam.past .room{opacity:.7}
.sec-title:first-child{margin-top:26px}
.status{display:inline-flex;align-items:center;gap:5px;color:#fff;border-radius:20px;padding:3px 12px;font-weight:600;font-size:12.5px;margin-bottom:6px}
.s-idle{background:var(--blue)} .s-running{background:#fb8c00} .s-done{background:#43a047}
.lect{color:var(--muted);font-size:14px;margin-bottom:10px}
.times{display:flex;flex-wrap:wrap;align-items:center;gap:5px 7px;margin-bottom:12px}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:20px;padding:3px 10px;font-weight:600;font-size:12.5px;border:1px solid transparent}
.pill.green{background:var(--green-bg);border-color:var(--green-bd)} .pill.red{background:var(--red-bg);border-color:var(--red-bd)} .pill.cyan{background:var(--cyan-bg);border-color:var(--cyan-bd)}
.arrow{color:#555}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.chip{display:inline-flex;align-items:center;gap:5px;background:#eceff3;border-radius:20px;padding:4px 12px;font-weight:600;font-size:12.5px}
.chip.red{background:#f44336;color:#fff}
.chip.green{background:#2e9e4f;color:#fff}
.room{background:#eff1f4;border:1px solid #d6dce3;border-radius:14px;padding:12px 18px;font-size:16px;margin-bottom:14px}
.scoreline{margin:0 0 12px;font-size:14px;color:var(--muted)} .scoreline b{color:var(--ok);font-size:16px}
.card-actions{display:flex;gap:8px;flex-wrap:wrap}

.exam-wrap{max-width:1240px;margin:0 auto;padding:20px 16px;display:grid;grid-template-columns:290px minmax(0,1fr);gap:20px;align-items:start}
.panel{padding:20px 16px;text-align:center;position:sticky;top:76px;max-height:calc(100vh - 92px);overflow:auto}
.panel h2{margin:0 0 10px;font-size:22px;font-weight:600;line-height:1.35}
.ptimes{display:flex;flex-direction:column;gap:6px;align-items:center;margin-bottom:14px}
.ptimes .row{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.ptimes .pill{font-size:12px;padding:2px 10px}
.prog{text-align:left;font-size:13px;color:var(--muted);margin:10px 0 14px}
.prog .l{display:flex;justify-content:space-between}
.bar{height:8px;background:#e6eaee;border-radius:5px;margin:3px 0 4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--slate);border-radius:5px;transition:width .25s}
.glabel{margin:16px 0 10px;font-weight:600}
.nums{display:flex;flex-wrap:wrap;justify-content:center;gap:5px}
.num{min-width:40px;height:40px;padding:0 10px;border:0;border-radius:6px;background:var(--grey);color:#111;font-weight:700;font-size:15px;cursor:pointer}
.num.ans{background:#43a047;color:#fff}
.num.cur{outline:3px solid #1e88e5;outline-offset:1px}
.num.ok{background:#43a047;color:#fff} .num.bad{background:#e53935;color:#fff} .num.skip{background:#cfd4d9;color:#333}
.timerrow{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;margin-top:6px}
.timer{background:#4f6470;color:#fff;border-radius:6px;padding:10px 16px;font-size:15px;font-variant-numeric:tabular-nums;font-weight:600;display:inline-flex;align-items:center}
.btn.sm{padding:10px 20px;border-radius:6px}

.main{padding:18px 22px 24px;min-width:0}
.qhead{display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;align-items:flex-start}
.pills{display:flex;gap:8px;flex-wrap:wrap}
.qpill{background:#e9edf1;color:#111;border-radius:20px;padding:3px 12px;font-weight:700;font-size:13px}
.qpill.dark{background:#5f7a88;color:#fff}
.autosave{color:var(--muted);font-size:13px;max-width:210px;text-align:right}
hr.sep{border:0;border-top:1px solid #e3e8ee;margin:14px 0 18px}
.qtext{font-size:16px;margin:0 0 18px}
.opts{display:flex;flex-direction:column;gap:14px}
.opt{display:flex;gap:26px;align-items:flex-start;border:1px solid #cfd7de;border-radius:10px;padding:14px 18px;cursor:pointer;background:#fff;transition:background .12s;text-align:left;width:100%;font-size:16px;color:var(--text)}
.opt:hover{background:#f7f9fa}
.opt .ltr{font-weight:700;font-size:inherit;min-width:12px;padding-top:2px}
.opt .tx{flex:1}
.opt.sel{background:#c9c9c9;border-color:#8c8c8c}
.opt.static{cursor:default}
.opt.correct{background:#e4f6e7;border-color:#43a047}
.opt.wrong{background:#fdebeb;border-color:#e53935}
.tag{font-size:12px;font-weight:700;border-radius:12px;padding:2px 10px;white-space:nowrap;align-self:center}
.tag.k{background:#43a047;color:#fff} .tag.y{background:#e53935;color:#fff} .tag.yk{background:#2e7d32;color:#fff}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:26px;align-items:center}
.actions .sp{flex:1}
.btn.save{font-size:15px}

.essay-q h3{margin:0 0 10px;font-size:19px}
.essay-q h4{margin:16px 0 8px;font-size:16px}
.essay-q ul,.essay-q ol{margin:6px 0 6px 20px;padding:0}
.tw{overflow-x:auto;margin:8px 0 14px;-webkit-overflow-scrolling:touch}
table.dt{border-collapse:collapse;width:100%;font-size:14px;min-width:420px}
table.dt th,table.dt td{border:1px solid #cfd8dc;padding:7px 10px;text-align:left;vertical-align:top}
table.dt th{background:#eceff1;font-weight:700}
table.dt td.r,table.dt th.r{text-align:right;white-space:nowrap}
table.dt tr.tot td{font-weight:700;background:#f6f8f9}
table.dt tr.hl td{font-weight:700;background:#e8f5e9}
.recon{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:8px 0 14px}
.recon h5{margin:0 0 6px;font-size:14px}
.recon table.dt{min-width:0}
textarea#essayTa{width:100%;min-height:260px;margin-top:14px;border:1px solid #cfd7de;border-radius:10px;padding:12px 14px;font:inherit;resize:vertical}
textarea#essayTa:focus{outline:2px solid #90caf9;border-color:#90caf9}
.key{border:1px solid #bfe0c4;background:#f5fbf6;border-radius:12px;padding:6px 16px 10px;margin-top:12px}
.key h4:first-child{margin-top:10px}
.mine ul,.mine ol{margin:4px 0 4px 20px;padding:0}
.mine{background:#f1f4f7;border-radius:10px;padding:10px 14px;font-size:14px;margin:6px 0 4px}
.calc{background:#f1f4f7;border-radius:10px;padding:10px 14px;font-size:14px;margin:6px 0 10px}
details.qd{margin:8px 0;border:1px solid #e3e8ee;border-radius:10px;padding:8px 14px;background:#fafbfc}
details.qd summary{cursor:pointer;font-weight:600}

.result{padding:22px}
.result h2{margin:0 0 14px}
.scorebox{display:flex;gap:26px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.ring{width:132px;height:132px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;border:10px solid var(--teal);background:#fff;flex:none}
.ring b{font-size:34px;line-height:1} .ring small{color:var(--muted)}
.stats{list-style:none;margin:0;padding:0;font-size:16px}
.stats li{margin:4px 0} .stats .ok{color:#2e7d32;font-weight:700} .stats .bad{color:#c62828;font-weight:700} .stats .skip{color:#6b7785;font-weight:700}
.rv{padding:18px 20px;margin-top:16px}
.rvhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:10px;flex-wrap:wrap}
.badge{font-size:12px;font-weight:700;border-radius:12px;padding:3px 12px;color:#fff}
.badge.ok{background:#43a047} .badge.bad{background:#e53935} .badge.skip{background:#8a949e}
.h-review{margin:26px 0 0;font-size:19px}
.intro{padding:26px}
.intro h2{margin:0 0 8px}
.intro ul{padding-left:20px;margin:10px 0 18px}

.modal-bg{position:fixed;inset:0;background:rgba(15,25,35,.55);display:none;align-items:center;justify-content:center;z-index:100;padding:16px}
.modal-bg.open{display:flex}
.modal{background:#fff;border-radius:16px;max-width:520px;width:100%;max-height:85vh;overflow:auto;padding:22px}
.modal h3{margin:0 0 10px}
.modal ol,.modal ul{padding-left:20px}
.modal.rules{max-width:680px;padding:26px 28px 28px;border-radius:18px}
.modal.rules h2{margin:0 0 12px;font-size:21px;line-height:1.25;font-weight:700;color:#1f2933}
.modal.rules ol{margin:0;padding-left:46px}
.modal.rules li{font-size:14.5px;line-height:1.7;margin:0 0 2px;color:#222}
.modal.rules li b{font-weight:700}
.modal.rules a{color:#0f7c8a;text-decoration:underline}
.rules-foot{margin-top:18px}
.rules-foot label{display:flex;align-items:center;gap:10px;font-size:15px;cursor:pointer;margin-bottom:18px}
.rules-foot input{width:20px;height:20px;border:2px solid #9aa5b1;border-radius:6px;accent-color:#2f4858;flex:none}
.rules-foot .btn{font-size:16px;padding:9px 22px;border-radius:10px}
@media(max-width:860px){.modal.rules{padding:22px 18px 22px}.modal.rules h2{font-size:20px}.modal.rules ol{padding-left:36px}.modal.rules li{font-size:14px}}
.modal .macts{display:flex;gap:10px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,30px);background:#263842;color:#fff;padding:10px 18px;border-radius:24px;opacity:0;transition:.25s;z-index:120;pointer-events:none;font-size:14px}
.toast.show{opacity:1;transform:translate(-50%,0)}
.foot{text-align:center;color:var(--muted);font-size:12px;padding:20px 10px 30px}

@media(max-width:860px){
  .exam-wrap{grid-template-columns:1fr;padding:12px}
  .panel{position:static;max-height:none}
  .panel h2{font-size:20px}
  .main{padding:16px 14px 20px}
  .autosave{text-align:left;max-width:none}
  .opt{gap:16px;padding:13px 14px}
  .recon{grid-template-columns:1fr}
  .recon .spacer{display:none}
  .exam{padding:14px 14px 14px 18px}
  .exam h3{font-size:17.5px}
  .profile{padding:10px 16px}
  .tb-right{gap:12px}
}
.pick{display:none}
.panel-close{display:none;float:right;margin:-4px 0 6px 8px}
.fab-timer{display:none}
.clo{background:#eef4fd;border-left:5px solid #2f80c8;border-radius:10px;padding:10px 16px 12px;margin:16px 0 4px}
.clo-t{color:#6b7785;font-size:15.5px}
.clo-d{color:#1f2933;font-size:15px;margin-top:4px;line-height:1.6}
.fq-label{font-size:17px;margin:6px 0 14px}
.btn.dl{background:#455a64;justify-content:center;font-size:15px;margin-bottom:18px}
.jlabel{font-size:17px;margin:20px 0 8px}
.rte{border:1px solid #cfd7de;border-radius:8px;overflow:hidden;background:#fff}
.rte-tb{background:#f6f7f8;border-bottom:1px solid #d9dfe5;padding:8px 12px;display:flex;gap:4px;align-items:center}
.rte-tb button{background:none;border:0;font-size:21px;padding:6px 12px;cursor:pointer;color:#222;border-radius:6px;line-height:1}
.rte-tb button:hover{background:#e9edf0}
.rte-tb .sep2{width:1px;height:28px;background:#cfd7de;margin:0 8px}
.rte-ed{min-height:300px;padding:14px 16px;outline:none;font-size:16px;line-height:1.7;overflow-wrap:anywhere}
.rte-ed:focus{box-shadow:inset 0 0 0 2px #90caf9}
.rte-ed ul,.rte-ed ol{margin:6px 0 6px 22px;padding:0}
.btn.green{background:#4caf50}
.btn.upl{margin-top:14px;font-size:15px}
.files{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.fchip{background:#eceff3;border-radius:16px;padding:4px 12px;font-size:13.5px}
.saved{color:#4caf50;margin-top:16px;font-size:17px;min-height:24px}
.essay-q p,.essay-q li{line-height:1.8}
@media(max-width:860px){
  .pick{display:flex;width:100%;justify-content:center;font-size:16px;padding:9px 16px;border-radius:10px;letter-spacing:.3px}
  .panel{display:none;position:fixed;inset:0;z-index:90;border-radius:0;max-height:none;overflow:auto;padding:18px 16px 100px}
  .panel.open{display:block}
  .panel-close{display:inline-flex}
  .exam-wrap{gap:18px}
  .fab-timer{display:flex;align-items:center;gap:8px;position:fixed;right:14px;bottom:18px;z-index:80;background:#263842;color:#fff;border-radius:32px;padding:11px 18px;font-size:15px;font-weight:700;font-variant-numeric:tabular-nums;box-shadow:0 6px 18px rgba(0,0,0,.3)}
  .essay-q p,.essay-q li,.qtext{text-align:justify}
  .qtext,.essay-q,.opt{font-size:17px}
  .rte-ed{min-height:260px}
  .main{padding-bottom:84px}

function textOf(h){ return String(h==null?'':h).replace(/<[^>]*>/g,' ').replace(/&nbsp;/g,' ').trim(); }
function isAnswered(it, a){
  return it.type==='mcq' ? (typeof a === 'number') : !!(a && textOf(a));
}
/* essay answers are stored as small HTML (bold, italic, lists). Clean before showing. */
function cleanHtml(h){
  h = String(h==null?'':h);
  if(!/<[a-z][\s\S]*>/i.test(h)) return esc(h).replace(/\n/g,'<br>');
  if(typeof DOMParser==='undefined') return esc(textOf(h));
  var ALLOW={B:1,STRONG:1,I:1,EM:1,U:1,UL:1,OL:1,LI:1,BR:1,DIV:1,P:1,SPAN:1};
  var BAD={SCRIPT:1,STYLE:1,IFRAME:1,OBJECT:1,EMBED:1,IMG:1,LINK:1,META:1,SVG:1,FORM:1,INPUT:1,BUTTON:1,TEXTAREA:1};
  var doc = new DOMParser().parseFromString('<body>'+h+'</body>','text/html');
  (function walk(n){
    Array.prototype.slice.call(n.childNodes).forEach(function(c){
      if(c.nodeType===1){
        if(BAD[c.tagName]){ n.removeChild(c); return; }
        walk(c);
        if(ALLOW[c.tagName]){ while(c.attributes.length) c.removeAttribute(c.attributes[0].name); }
        else { while(c.firstChild) n.insertBefore(c.firstChild,c); n.removeChild(c); }
      }else if(c.nodeType!==3){ n.removeChild(c); }
    });
  })(doc.body);
  return doc.body.innerHTML;
}

function answered(ex, st){

}
function startAttempt(id){
  var ex = EX(id), st = S(id);
  var m=[], e=[];
  ex.items.forEach(function(it,i){ (it.type==='mcq'?m:e).push(i); });
  if(st.history.length) shuffle(m);
  st.status='running'; st.order=m.concat(e); st.ans={}; st.files={}; st.saved={}; st.cur=0;
  st.startedAt=Date.now(); st.endsAt=Date.now()+ex.mins*60000; st.result=null;
  save();
}
function finalize(id, auto){
  var ex = EX(id), st = S(id);
  if(st.status!=='running') return;
  var mT=0,mA=0,c=0,eT=0,eA=0;
  ex.items.forEach(function(it,i){
    var a = st.ans[i];
    if(it.type==='mcq'){ mT++; if(isAnswered(it,a)) mA++; if(a===it.a) c++; }
    else { eT++; if(isAnswered(it,a)) eA++; }
  });
  var res = {at:Date.now(), total:mT, correct:c, wrong:mA-c, blank:mT-mA, score: mT? c/mT*100 : null, essayTotal:eT, essayAnswered:eA, auto:!!auto};
  st.status='locked'; st.result=res;
  st.history.push({at:res.at,score:res.score,correct:c,total:mT});
  save();
  if(auto) toast(T('t_timeup'));
}

document.addEventListener('click', function(e){
  var t = e.target.closest('[data-act]');
  if(!t || (t.dataset.act!=='lang' && t.dataset.act!=='lgHelp' && t.dataset.act!=='lgLang')) closeLang();
  if(!t){
    if(!e.target.closest('.menu')) closeMenu();
    if(e.target.id==='modalBg') closeModal();
    return;
  }
  var act = t.dataset.act, id = t.dataset.id;
  var st = route.view==='exam' ? S(route.id) : null;
  switch(act){
    case 'menu': $('#menu').classList.toggle('open'); $('#menuBg').classList.toggle('open'); e.stopPropagation(); break;
    case 'lang': toggleLang(); break;
    case 'lgHelp': toggleLg('lgHelpMenu'); break;
    case 'lgLang': toggleLg('lgLangMenu'); break;
    case 'campus': googleLogin(); break;
    case 'login': manualLogin(); break;
    case 'eye': var pw=$('#lgPass'), ic=t.querySelector('i'); if(pw){ var sh = pw.type==='password'; pw.type = sh?'text':'password'; if(ic) ic.className = 'fas fa-eye'+(sh?'-slash':''); } break;
    case 'logout': doLogout(); break;
    case 'setlang': setLang(t.dataset.l); break;
    case 'menuClose': closeMenu(); break;
    case 'opLink': closeMenu(); break;
    case 'home': closeMenu(); go(''); break;
    case 'rules': closeMenu(); showRules(); break;
    case 'rulesClose':
      var cb = document.getElementById('rulesHide');
      if(cb && cb.checked){ try{ localStorage.setItem(HIDE_RULES_KEY,'1'); }catch(err){} }
      closeModal(); break;
    case 'tutorial': e.preventDefault(); toast(T('t_tutorial')); break;
    case 'help': closeMenu(); showHelp(); break;
    case 'resetall': closeMenu(); confirmReset(); break;
    case 'modal': var a = modalActs[parseInt(t.dataset.k,10)]; if(a && a.fn) a.fn(); break;
    case 'open': if(EX(id).items.length) go('/exam/'+id); break;
    case 'start': startAttempt(id); render(); window.scrollTo(0,0); break;
    case 'retakeHome': if(EX(id).items.length) confirmRetake(id, true); break;
    case 'retake': confirmRetake(route.id, false); break;
    case 'lock': confirmLock(); break;
    case 'num':
      var p = parseInt(t.dataset.p,10);
      if(st.status==='locked'){ var el = document.getElementById('rv'+p); if(el) el.scrollIntoView({behavior:'smooth',block:'start'}); }
      else { st.cur = p; save(); renderPanel(); renderMain(); }
      closePick(); if(window.innerWidth<=860 && st.status!=='locked') window.scrollTo(0,0);
      break;
    case 'pick': var pn=$('#panel'); if(pn) pn.classList.add('open'); break;
    case 'closepick': closePick(); break;
    case 'upload': var fi=document.getElementById('essayFile'); if(fi) fi.click(); break;
    case 'dlq': downloadQuestion(); break;
    case 'opt':
      var idx = st.order[st.cur], i = parseInt(t.dataset.i,10);
      if(st.ans[idx]===i) delete st.ans[idx]; else st.ans[idx]=i;
      save(); renderPanel(); renderMain(); break;
    case 'save':
      var cit = st.status==='running' ? EX(route.id).items[st.order[st.cur]] : null;
      if(cit && cit.type==='essay'){ markSaved(); }
      save(); toast(T('t_saved')); break;
    case 'prev': if(st.cur>0){ st.cur--; save(); renderPanel(); renderMain(); window.scrollTo(0,0);} break;
    case 'next': if(st.cur<st.order.length-1){ st.cur++; save(); renderPanel(); renderMain(); window.scrollTo(0,0);} break;
  }
});
function closePick(){ var pn=$('#panel'); if(pn) pn.classList.remove('open'); }
function markSaved(){
  var st = S(route.id), idx = st.order[st.cur];
  st.saved[idx] = nowClock();
  var el = document.getElementById('savedAt');
  if(el) el.innerHTML = '<i class="fas fa-shield-alt"></i> '+T('saved_at',esc(st.saved[idx]));
}
function downloadQuestion(){
  var ex = EX(route.id), st = S(route.id), idx = st.order[st.cur], it = ex.items[idx];
  var txt = '';
  try{
    var html = it.q.replace(/<\/(p|li|h[1-6]|div|tr)>/gi,'$&\n').replace(/<br\s*\/?>/gi,'\n');
    var doc = new DOMParser().parseFromString('<body>'+html+'</body>','text/html');
    txt = doc.body.textContent.replace(/\n{3,}/g,'\n\n').trim();
  }catch(err){ txt = textOf(it.q); }
  try{
    var blob = new Blob([ex.title+'\n\n'+txt+'\n'], {type:'text/plain;charset=utf-8'});
    var a = document.createElement('a'); a.href = URL.createObjectURL(blob);
    a.download = 'Soal_'+ex.id+'_Essay_'+(st.cur-nMcq(ex)+1)+'.txt';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(a.href); }, 1000);
  }catch(err){ toast(T('t_nodl')); }
}

  if(e.target.id==='essayEd' && route.view==='exam'){

   +'<label for="lgPass">'+T('lg_pass')+'</label><div class="lg-pw"><input class="lg-input" id="lgPass" type="password" autocomplete="off" placeholder="'+esc(T('lg_ph_pass'))+'" value="'+esc(LG.pass)+'"><button type="button" class="lg-eye" data-act="eye" aria-label="Show password"><i class="fas fa-eye"></i></button></div>'
   +'<label for="lgCap">'+T('lg_captcha')+'</label><div class="lg-cap"><div class="lg-q">'+LG.a+' '+LG.op+' '+LG.b+' =</div><input class="lg-input" id="lgCap" type="text" inputmode="numeric" autocomplete="off" placeholder="'+esc(T('lg_ph_cap'))+'" value="'+esc(LG.cap)+'"></div>'
   +'<button class="lg-btn" data-act="login"><i class="fas fa-sign-in-alt"></i> '+T('lg_login')+'</button>'
   +'</div>'
   +'<div class="lg-foot">'
   +'<div class="lgdd"><button class="lg-sm dark" data-act="lgHelp"><i class="fab fa-whatsapp"></i> '+T('help')+'</button><div class="lgmenu" id="lgHelpMenu"><a href="'+WA_URL+'" target="_blank" rel="noopener">Operator 1</a></div></div>'
   +'<div class="lgdd"><button class="lg-sm" data-act="lgLang"><span class="flag'+(en?' en':'')+'"></span> '+(en?'EN':'ID')+'</button><div class="lgmenu right" id="lgLangMenu"><button data-act="setlang" data-l="en"><span class="flag en"></span> English</button><button data-act="setlang" data-l="id"><span class="flag"></span> Indonesian</button></div></div>'
   +'</div></div>';
}
function doLogin(em, name){
  USER = em.toLowerCase();
  STUDENT = (name && String(name).trim()) ? String(name).trim().toUpperCase() : nameFromEmail(USER);
  try{ localStorage.setItem(USER_KEY, USER); localStorage.setItem(USERNAME_KEY, STUDENT); }catch(e){}
  LG.email=''; LG.pass=''; clearErr(); newCaptcha();
  closeModal(); closeLang();
  if(location.hash){ location.hash = ''; } else { parseHash(); render(); }
  window.scrollTo(0,0);
  toast(T('t_welcome', STUDENT));
  try{ if(!localStorage.getItem(HIDE_RULES_KEY)) showRules(); }catch(err){}
}
function doLogout(){
  USER = '';
  try{ localStorage.removeItem(USER_KEY); localStorage.removeItem(USERNAME_KEY); }catch(e){}
  closeMenu(); closeModal(); closeLang();
  if(location.hash){ location.hash = ''; } else { parseHash(); render(); }
  window.scrollTo(0,0);
  toast(T('t_logout'));
}
/* ---------------------------------------------------------------------------
   MANUAL LOGIN (email + password) - verified by Firebase Authentication (Email/Password provider).
   1. console.firebase.google.com > create project > Build > Authentication > Sign-in method > enable "Email/Password"
   2. Authentication > Users > Add user (email + password for each student)
   3. Authentication > Settings > Authorized domains > add your site domain (e.g. sumonusaputra.vercel.app)
   4. Project settings > Your apps > Web app > copy the firebaseConfig values below.
   Until FIREBASE_CONFIG is filled in, manual login is disabled (it never accepts unverified passwords).
--------------------------------------------------------------------------- */
var FIREBASE_CONFIG = null;   /* e.g. {apiKey:'...', authDomain:'...', projectId:'...', appId:'...'} */
var FB_VER = '10.12.2';
function loadFirebase(cb, fail){
  if(window.firebase && firebase.auth){ cb(); return; }
  function add(src, next){
    var sc = document.createElement('script'); sc.src = src; sc.async = true;
    sc.onload = next; sc.onerror = fail; document.head.appendChild(sc);
  }
  add('https://www.gstatic.com/firebasejs/'+FB_VER+'/firebase-app-compat.js', function(){
    add('https://www.gstatic.com/firebasejs/'+FB_VER+'/firebase-auth-compat.js', cb);
  });
}
function manualLogin(){
  if(LG.busy) return;
  syncLG(); clearErr();
  var em = (LG.email||'').trim();
  if(!em){ setErr('lg_err_empty'); return; }
  if(!CAMPUS_RE.test(em)){ setErr('lg_err_unreg',[em]); return; }
  if(!LG.pass){ setErr('lg_err_empty'); return; }
  var cap = (LG.cap||'').trim();
  if(!/^-?\d+$/.test(cap) || parseInt(cap,10)!==capAnswer()){ newCaptcha(); setErr('lg_err_cap'); return; }
  if(!FIREBASE_CONFIG){ setErr('lg_err_nomanual'); return; }
  LG.busy = true;
  var done = function(){ LG.busy = false; };
  loadFirebase(function(){
    try{
      if(!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
      var auth = firebase.auth();
      auth.setPersistence(firebase.auth.Auth.Persistence.NONE).catch(function(){}).then(function(){
        return auth.signInWithEmailAndPassword(em, LG.pass);
      }).then(function(cred){
        var name = cred && cred.user && cred.user.displayName;
        done(); auth.signOut().catch(function(){});
        doLogin(em, name);
      }).catch(function(e){
        done();
        var c = (e && e.code) || '';
        if(c==='auth/too-many-requests') setErr('lg_err_toomany');
        else if(c==='auth/network-request-failed') setErr('lg_err_net');
        else if(c==='auth/invalid-credential' || c==='auth/wrong-password' || c==='auth/user-not-found' || c==='auth/invalid-email' || c==='auth/user-disabled') setErr('lg_err_badcred');
        else setErr('lg_err_google');
      });
    }catch(err){ done(); setErr('lg_err_google'); }
  }, function(){ done(); setErr('lg_err_gsi'); });
}
function loadGsi(){
  if(!GOOGLE_CLIENT_ID || (window.google && google.accounts && google.accounts.oauth2) || document.getElementById('gsiScript')) return;
  var sc = document.createElement('script'); sc.id='gsiScript'; sc.src='https://accounts.google.com/gsi/client'; sc.async=true; sc.defer=true;
  document.head.appendChild(sc);
}
function googleLogin(){
  clearErr();
  if(!GOOGLE_CLIENT_ID){ setErr('lg_err_nocfg'); return; }
  if(!(window.google && google.accounts && google.accounts.oauth2)){ loadGsi(); setErr('lg_err_gsi'); return; }
  try{
    var tc = google.accounts.oauth2.initTokenClient({
      client_id: GOOGLE_CLIENT_ID,
      scope: 'openid email profile',
      prompt: 'select_account',
      callback: function(r){
        if(!r || r.error || !r.access_token){ setErr('lg_err_google'); return; }
        fetch('https://www.googleapis.com/oauth2/v3/userinfo', {headers:{Authorization:'Bearer '+r.access_token}})
          .then(function(x){ if(!x.ok) throw new Error('userinfo'); return x.json(); })
          .then(function(u){
            var em = String((u && u.email) || '').trim();
            if(!em || u.email_verified===false || !CAMPUS_RE.test(em)){
              try{ google.accounts.oauth2.revoke(r.access_token, function(){}); }catch(e){}
              setErr('lg_err_unreg', [em || '-'], true); return;
            }
            doLogin(em, u.name);
          })
          .catch(function(){ setErr('lg_err_google'); });
      },
      error_callback: function(err){ if(err && err.type==='popup_closed') return; setErr('lg_err_popup'); }
    });
    tc.requestAccessToken();
  }catch(e){ setErr('lg_err_gsi'); }
}
function toggleLg(id){
  var m = document.getElementById(id); if(!m) return;
  var open = !m.classList.contains('open');
  Array.prototype.forEach.call(document.querySelectorAll('.lgmenu'), function(x){ x.classList.remove('open'); });
  if(open) m.classList.add('open');
}

/* ===================== LANGUAGE SWITCH ===================== */
function closeLang(){ var m=$('#langMenu'), b=$('#langBtn'); if(m) m.classList.remove('open'); if(b) b.classList.remove('open'); Array.prototype.forEach.call(document.querySelectorAll('.lgmenu'), function(x){ x.classList.remove('open'); }); }
function toggleLang(){ var m=$('#langMenu'), b=$('#langBtn'); if(!m) return; var o=!m.classList.contains('open'); m.classList.toggle('open',o); if(b) b.classList.toggle('open',o); }
function applyLang(){
  document.documentElement.lang = LANG;
  document.title = T('doc_title');
  Array.prototype.forEach.call(document.querySelectorAll('[data-i18n]'), function(el){ el.textContent = T(el.getAttribute('data-i18n')); });
  var f=$('#langFlag'); if(f) f.className = 'flag' + (LANG==='en' ? ' en' : '');
  var c=$('#langCode'); if(c) c.textContent = LANG==='en' ? 'EN' : 'ID';
  Array.prototype.forEach.call(document.querySelectorAll('#langMenu button'), function(b){ b.classList.toggle('on', b.dataset.l===LANG); });
}
function setLang(l){
  l = (l==='en') ? 'en' : 'id';
  syncLG();
  var rulesOpen = $('#modalBg').classList.contains('open') && $('#modal').classList.contains('rules');
  LANG = l;
  try{ localStorage.setItem(LANG_KEY, l); }catch(err){}
  closeLang(); closeModal();
  applyLang(); render();
  if(rulesOpen) showRules();
  toast(T('t_lang'));
}

/* ===================== INIT ===================== */
(function(){var l=document.createElement('link');l.rel='icon';l.href=LOGO_SRC;document.head.appendChild(l);})();
applyLang();
loadGsi();
if(FIREBASE_CONFIG){ loadFirebase(function(){}, function(){}); }
parseHash();
render();
try{ if(USER && route.view==='home' && !localStorage.getItem(HIDE_RULES_KEY)) showRules(); }catch(err){}
})();
</script>
